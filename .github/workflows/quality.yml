name: quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    defaults:
      run:
        working-directory: DeskThingServer

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.15.0
          cache: npm
          cache-dependency-path: DeskThingServer/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

      - name: Build application bundles
        run: npm run build:bundle

      - name: Package Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: npx electron-builder --dir --win
