name: package validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package unsigned ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest

    defaults:
      run:
        working-directory: DeskThingServer

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.15.0
          cache: npm
          cache-dependency-path: DeskThingServer/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

      - name: Package unpacked application
        env:
          DESKTHING_SKIP_NOTARIZATION: 'true'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:unpack

      - name: Upload unsigned package
        uses: actions/upload-artifact@v4
        with:
          name: deskthing-unsigned-${{ runner.os }}-${{ runner.arch }}
          path: DeskThingServer/dist/
          if-no-files-found: error
          retention-days: 7
